name: Generate CV PDF

on:
  push:
    paths:
      - "docs/cv.md"
      - "docs/cv-pdf.css"
      - "scripts/generate-pdf.mjs"
      - ".github/workflows/generate-cv-pdf.yml"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate styled HTML
        run: |
          pandoc docs/cv.md \
            --standalone \
            --css=cv-pdf.css \
            --metadata title="Mike CV" \
            -o docs/cv.html

      - name: Generate PDF with Chromium
        run: |
          node scripts/generate-pdf.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/cv.html docs/cv.pdf

          git commit -m "Generate styled CV PDF" || echo "No changes"

          git push
