name: Generate CV PDF

on:
  push:
    paths:
      - 'docs/cv.md'

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base

      - name: Generate PDF
        run: |
          pandoc docs/cv.md -o docs/cv.pdf

      - name: Commit PDF
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add docs/cv.pdf

          git commit -m "Auto-generate CV PDF" || echo "No changes"

          git push
