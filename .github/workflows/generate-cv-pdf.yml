name: Generate CV PDF

on:
  push:
    paths:
      - "docs/cv.md"
      - ".github/workflows/generate-cv-pdf.yml"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended

      - name: Generate CV PDF
        run: |
          pandoc docs/cv.md \
            -o docs/cv.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V mainfont="DejaVu Sans"

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/cv.pdf
          git commit -m "Generate CV PDF" || echo "No PDF changes"
          git push
