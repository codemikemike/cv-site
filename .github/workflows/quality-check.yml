name: Quality Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate-static-site:
    name: Validate static portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f data/cv.json
          test -f src/app.js

      - name: Validate JSON
        run: |
          python -m json.tool data/cv.json > /dev/null

      - name: Check for broken local references
        run: |
          grep -q 'href="style.css"' index.html
          grep -q 'src="src/app.js"' index.html
          grep -q 'href="site.webmanifest"' index.html
